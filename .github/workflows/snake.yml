name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake animation (Blue Matrix theme)
        uses: Platane/snk@v3
        with:
          github_user_name: DivOnGit
          outputs: dist/github-contribution-grid-snake.svg
        env:
          SNAKE_COLOR: "#00BFFF"                   # Neon blue
          DOT_COLOR: "#0D1117,#1E293B,#007BFF"    # Dark blue gradient
          SNAKE_SPEED: "5"                        # Slightly faster movement

      - name: Push Snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
